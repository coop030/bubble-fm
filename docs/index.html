<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bubble fm</title>
<meta name="description" content="Music to fall in love to. Three songs a day: Breakfast, Boogie, Date Night.">
<meta property="og:title" content="bubble fm">
<meta property="og:description" content="Music to fall in love to.">
<meta property="og:image" content="logo.png">
<meta name="theme-color" content="#e98ae0">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3a1062;
    --violet: #5a1a9c;
    --pink: #ff4fa8;
    --pill: rgba(255, 255, 255, 0.92);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: Fredoka, system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(170deg, #ffb8df, #e98ae0 45%, #b65fe6 80%, #7d3ad0);
    background-size: 100% 200%;
    animation: drift 18s ease-in-out infinite alternate;
    overflow-x: hidden;
  }
  @keyframes drift { from { background-position: 0 0; } to { background-position: 0 100%; } }

  .glow { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; }
  .glow.a { width: 70vmax; height: 70vmax; left: -30vmax; bottom: -30vmax; background: radial-gradient(circle, rgba(143, 240, 255, .55), transparent 60%); animation: orbit 20s ease-in-out infinite alternate; }
  .glow.b { width: 60vmax; height: 60vmax; right: -25vmax; top: -25vmax; background: radial-gradient(circle, rgba(255, 138, 216, .6), transparent 60%); animation: orbit 24s ease-in-out infinite alternate-reverse; }
  @keyframes orbit { to { transform: translate(6vmax, -4vmax); } }

  .bubbles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .bubble {
    position: absolute; bottom: -120px; border-radius: 50%;
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0 9%, transparent 10%),
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.06) 0 58%, rgba(143,240,255,.45) 74%, rgba(255,127,212,.75) 86%, rgba(185,139,255,.95) 95%, #fff 100%);
    animation: rise linear infinite;
  }
  @keyframes rise {
    0% { transform: translate(0, 0); }
    50% { transform: translate(24px, -55vh); }
    100% { transform: translate(-12px, calc(-100vh - 160px)); }
  }

  main { position: relative; z-index: 1; max-width: 460px; margin: 0 auto; padding: 40px 16px 48px; display: flex; flex-direction: column; align-items: center; gap: 18px; }

  .logo { width: 128px; height: 128px; border-radius: 50%; box-shadow: 0 14px 30px rgba(90, 26, 156, .35); animation: bob 5s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(-2deg); } }

  h1 {
    margin: 4px 0 0; font-family: 'Bagel Fat One', sans-serif; font-weight: 400; font-size: 52px; line-height: 1; color: #fff;
    text-shadow: 0 3px 0 var(--pink), 0 6px 0 var(--violet), 0 12px 18px rgba(40, 0, 80, .35);
  }
  .tagline { margin: 6px 0 4px; font-weight: 700; font-size: 18px; color: #fff; text-shadow: 0 2px 0 rgba(90, 26, 156, .5); text-align: center; }

  .card { width: 100%; background: var(--pill); border-radius: 28px; padding: 16px; box-shadow: 0 6px 0 #ff7fc8, 0 16px 30px rgba(90, 26, 156, .25); }
  .card h2 { margin: 0 0 10px; font-family: 'Bagel Fat One', sans-serif; font-weight: 400; font-size: 22px; color: var(--violet); display: flex; justify-content: space-between; align-items: baseline; }
  .card h2 small { font-family: Fredoka, sans-serif; font-weight: 600; font-size: 14px; color: #7a4aa8; }
  .song { display: flex; gap: 12px; align-items: center; padding: 8px; border-radius: 18px; text-decoration: none; color: inherit; transition: background .2s; }
  .song:hover, .song:focus-visible { background: #fbe9ff; }
  .song img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 3px #fff, 0 0 0 5px #c9a0ff; flex-shrink: 0; }
  .song .meta { display: flex; flex-direction: column; min-width: 0; }
  .song .label { font-size: 13px; font-weight: 700; color: #b0309a; }
  .song .title { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song .artist { font-size: 15px; font-weight: 500; color: #5a2a8a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .links { width: 100%; display: flex; flex-direction: column; gap: 14px; }
  .btn {
    display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 8px 18px 8px 8px; border-radius: 999px;
    background: var(--pill); color: var(--ink); text-decoration: none; font-weight: 700; font-size: 18px;
    box-shadow: 0 5px 0 var(--shadow, #ff7fc8), 0 12px 24px rgba(90, 26, 156, .22);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover, .btn:focus-visible { transform: translateY(-2px); }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--shadow, #ff7fc8), 0 6px 12px rgba(90, 26, 156, .2); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .btn img, .btn .icon { width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0; }
  .btn .icon { display: grid; place-items: center; background: linear-gradient(135deg, #ff8ad8, #b98bff); color: #fff; }
  .btn .text { display: flex; flex-direction: column; line-height: 1.15; }
  .btn .text small { font-size: 13px; font-weight: 600; color: #7a4aa8; }
  .btn .arrow { margin-left: auto; color: #b98bff; }
  .breakfast { --shadow: #ff9fd2; }
  .boogie { --shadow: #b0309a; }
  .datenight { --shadow: #6a3cff; }

  footer { margin-top: 10px; font-size: 14px; font-weight: 600; color: #fff; opacity: .9; text-align: center; }
  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    body, .glow, .bubble, .logo { animation: none !important; }
    .bubble { display: none; }
  }
</style>
</head>
<body>
<div class="glow a" aria-hidden="true"></div>
<div class="glow b" aria-hidden="true"></div>
<div class="bubbles" aria-hidden="true" id="bubbles"></div>

<main>
  <img class="logo" src="logo.png" alt="bubble fm logo: a boombox inside a soap bubble">
  <h1>bubble fm</h1>
  <p class="tagline">music to fall in love to</p>

  <section class="card" id="today" hidden aria-labelledby="today-title">
    <h2 id="today-title">today's three <small id="today-day"></small></h2>
    <div id="today-songs"></div>
  </section>

  <nav class="links" aria-label="Links">
    <a class="btn breakfast" data-link="breakfast" href="#">
      <img src="covers/breakfast.jpg" alt="">
      <span class="text">breakfast<small>slow mornings · on Spotify</small></span>
      <svg class="arrow" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
    <a class="btn boogie" data-link="boogie" href="#">
      <img src="covers/boogie.jpg" alt="">
      <span class="text">boogie<small>house to move to · on Spotify</small></span>
      <svg class="arrow" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
    <a class="btn datenight" data-link="datenight" href="#">
      <img src="covers/datenight.jpg" alt="">
      <span class="text">date night<small>soul for two · on Spotify</small></span>
      <svg class="arrow" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
    <a class="btn" data-link="loveLetter" href="#" hidden>
      <span class="icon" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.8 6.6 4.8c2.2 0 3.6 1.3 4.4 2.6.8-1.3 2.2-2.6 4.4-2.6 3.6 0 5.7 3.6 4.2 7-2.1 4.6-9.6 9.2-9.6 9.2z"/></svg></span>
      <span class="text">send us your love letter<small>your story, maybe on our page</small></span>
      <svg class="arrow" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
    <a class="btn" data-link="instagram" href="#" hidden>
      <span class="icon" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg></span>
      <span class="text">instagram<small>three songs, every day</small></span>
      <svg class="arrow" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
  </nav>

  <footer>made with love in Berlin</footer>
</main>

<script>
  // Edit these links. An empty link hides its button.
  const LINKS = {
    breakfast: 'https://open.spotify.com/playlist/5qiSCvjWF6ENGUopJGoJ5Y',
    boogie: 'https://open.spotify.com/playlist/24scDJiI8kuyuYhnBo45Nl',
    datenight: 'https://open.spotify.com/playlist/4Kngss55TGy2NwLk2RWTwY',
    loveLetter: '',
    instagram: '',
  };
  // Today's three come from the daily run.
  const LATEST = 'https://raw.githubusercontent.com/coop030/bubble-fm/main/latest.json';
  const LABEL = { breakfast: 'breakfast', boogie: 'boogie', datenight: 'date night' };

  document.querySelectorAll('[data-link]').forEach((a) => {
    const url = LINKS[a.dataset.link];
    if (url) {
      a.href = url;
      a.hidden = false;
      a.target = '_blank';
      a.rel = 'noopener';
    } else {
      a.hidden = true;
    }
  });

  // Floating bubbles in the background.
  const box = document.getElementById('bubbles');
  for (let i = 0; i < 14; i++) {
    const b = document.createElement('span');
    const size = 14 + Math.random() * 46;
    b.className = 'bubble';
    b.style.width = b.style.height = size + 'px';
    b.style.left = Math.random() * 100 + 'vw';
    b.style.animationDuration = 12 + Math.random() * 14 + 's';
    b.style.animationDelay = -Math.random() * 26 + 's';
    box.appendChild(b);
  }

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };

  fetch(LATEST, { cache: 'no-store' })
    .then((r) => (r.ok ? r.json() : Promise.reject()))
    .then((post) => {
      if (!post || !Array.isArray(post.tracks) || !post.tracks.length) return;
      document.getElementById('today-day').textContent = 'day ' + String(post.day).padStart(3, '0');
      const list = document.getElementById('today-songs');
      for (const t of post.tracks) {
        const a = el('a', 'song');
        a.href = t.url || LINKS[t.playlist] || '#';
        a.target = '_blank';
        a.rel = 'noopener';
        const img = el('img');
        img.src = t.coverUrl || 'covers/' + t.playlist + '.jpg';
        img.alt = '';
        const meta = el('span', 'meta');
        meta.append(el('span', 'label', LABEL[t.playlist] || t.playlist), el('span', 'title', t.title), el('span', 'artist', t.artist));
        a.append(img, meta);
        list.appendChild(a);
      }
      document.getElementById('today').hidden = false;
    })
    .catch(() => {});
</script>
</body>
</html>
