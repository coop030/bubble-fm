name: Daily post

on:
  schedule:
    # 08:37 Berlin in winter (07:37 UTC). GitHub can start scheduled runs a few minutes late.
    - cron: '37 7 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview = images only, manual = images + mark tracks as used (you post), post = post to Instagram'
        type: choice
        options: [preview, manual, post]
        default: preview
      sample:
        description: 'Use sample tracks instead of Spotify'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      PLAYLIST_BREAKFAST: ${{ secrets.PLAYLIST_BREAKFAST }}
      PLAYLIST_BOOGIE: ${{ secrets.PLAYLIST_BOOGIE }}
      PLAYLIST_DATENIGHT: ${{ secrets.PLAYLIST_DATENIGHT }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      SAMPLE: ${{ inputs.sample && 'true' || 'false' }}
      MODE: ${{ inputs.mode || vars.SCHEDULED_MODE || 'preview' }}
      ANIMATE: ${{ vars.ANIMATE || 'true' }}
      VIDEO_SECONDS: ${{ vars.VIDEO_SECONDS || '30' }}
      # A preview always renders fresh, even if today's post already exists.
      FORCE: ${{ (inputs.mode || vars.SCHEDULED_MODE || 'preview') == 'preview' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Make today's post
        run: node src/index.js prepare

      - name: Keep the images for download
        uses: actions/upload-artifact@v4
        with:
          name: bubble-fm-post
          path: posts/
          retention-days: 14

      # Videos never go into main's history (30-second loops would bloat the repo).
      # previews and media are single-commit branches that get replaced on every run.
      - name: Save the preview to the previews branch
        if: env.MODE == 'preview'
        run: |
          git config user.name "bubble-fm-bot"
          git config user.email "bubble-fm-bot@users.noreply.github.com"
          PV="$RUNNER_TEMP/previews"
          git worktree add -q --orphan -b preview-tmp "$PV"
          DAY="$(TZ=Europe/Berlin date +%F)"
          mkdir -p "$PV/$DAY-run${GITHUB_RUN_NUMBER}" && cp -r "posts/$DAY/." "$PV/$DAY-run${GITHUB_RUN_NUMBER}/"
          cd "$PV"
          git add -A -f
          git commit -qm "Preview from run ${GITHUB_RUN_NUMBER}"
          git push -q -f origin HEAD:previews

      - name: Put today's videos online for Instagram
        if: env.MODE == 'post'
        run: |
          git config user.name "bubble-fm-bot"
          git config user.email "bubble-fm-bot@users.noreply.github.com"
          DAY="$(TZ=Europe/Berlin date +%F)"
          MD="$RUNNER_TEMP/media"
          git worktree add -q --orphan -b media-tmp "$MD"
          mkdir -p "$MD/posts/$DAY" && cp -r "posts/$DAY/." "$MD/posts/$DAY/"
          cd "$MD"
          git add -A -f
          git commit -qm "Media for $DAY"
          git push -q -f origin HEAD:media
          echo "PUBLISH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Post to Instagram (or just mark the tracks as used in manual mode)
        if: env.MODE == 'post' || env.MODE == 'manual'
        run: node src/index.js publish

      - name: Remember what was posted
        if: env.MODE == 'post' || env.MODE == 'manual'
        run: |
          git add state.json latest.json posts
          git diff --cached --quiet || git commit -m "Posted day for $(date +%F)"
          git push
