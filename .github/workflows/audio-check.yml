name: Audio check

# Searches Instagram's licensed music for songs, separated by |, without posting anything.
on:
  workflow_dispatch:
    inputs:
      queries:
        description: 'Songs to look up, separated by |'
        required: false
        default: ''
      raw:
        description: 'Show the raw answer from Instagram'
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Search
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          QUERIES: ${{ inputs.queries }}
          AUDIO_RAW: ${{ inputs.raw && 'true' || 'false' }}
        run: node src/index.js audio "$QUERIES"
