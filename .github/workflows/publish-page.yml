name: Publish link page

# Copies docs/ to the gh-pages branch, which GitHub Pages serves at coop030.github.io/bubble-fm.
on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push docs to gh-pages
        run: |
          git config user.name "bubble-fm-bot"
          git config user.email "bubble-fm-bot@users.noreply.github.com"
          git fetch -q origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add -q -B gh-pages "$RUNNER_TEMP/site" origin/gh-pages
          rsync -a --delete --exclude .git docs/ "$RUNNER_TEMP/site/"
          touch "$RUNNER_TEMP/site/.nojekyll"
          cd "$RUNNER_TEMP/site"
          git add -A
          git diff --cached --quiet || { git commit -qm "Publish link page from ${GITHUB_SHA::7}"; git push -q origin gh-pages; }
