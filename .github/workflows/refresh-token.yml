name: Refresh Instagram token

# Instagram tokens expire after 60 days. This renews it every two weeks.
on:
  schedule:
    - cron: '13 4 1,15 * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Get a new token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node src/index.js refresh
      - name: Save it as the IG_ACCESS_TOKEN secret
        env:
          GH_TOKEN: ${{ secrets.SECRETS_TOKEN }}
        run: |
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < .new-token
          rm .new-token
